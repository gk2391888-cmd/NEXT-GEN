# Netlify hosting (the free plan allows commercial sites). Netlify's Next.js runtime
# (@netlify/plugin-nextjs) is added automatically for Next.js sites; it turns the
# app's API routes and server pages into Netlify Functions.
[build]
  command = "npm run build"
  publish = ".next"
  # Same rule as vercel.json: only build main commits whose message contains [deploy].
  ignore = "node scripts/should-deploy.mjs"

[build.environment]
  NODE_VERSION = "22"
